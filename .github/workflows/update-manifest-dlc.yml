# =============================================================
# HMOL联机模块 (DLC) 自动更新 manifest 生成 workflow
# 放置位置: HMOL 仓库 main 分支的 .github/workflows/update-manifest-dlc.yml
#
# 流程: 发布 Release(附件 HMOL联机模块.exe) -> 本 workflow 自动
#       生成 update/HMOL-DLC-LJMK-json 并提交到 update 分支
# CDN:  https://cdn.jsdelivr.net/gh/OrangeArtc0915/Hello-Mental-Omega-Launcher@update/update/HMOL-DLC-LJMK-json
# =============================================================
name: Auto-Update DLC Manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for testing (e.g. v3.0.1)'
        required: true
        default: 'v3.0.1'

permissions:
  contents: write

jobs:
  update-dlc-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch first
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure update branch exists on remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --heads origin update | grep -q update; then
            echo "update branch exists, checking out..."
            git checkout update
            git pull origin update
          else
            echo "update branch not found, creating from main..."
            git checkout -b update
            git push origin update
          fi

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION=$(echo "$TAG" | sed 's/^v//')
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Using tag=$TAG, version=$VERSION"

      - name: Download DLC exe and compute SHA256
        id: dlc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, subprocess, os, sys

          result = subprocess.run(
              ['gh', 'release', 'view', os.environ['TAG'], '--json', 'assets,body'],
              capture_output=True, text=True, check=True
          )
          data = json.loads(result.stdout)
          body = data.get('body', '') or ''
          with open('/tmp/release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)

          # 只认 HMOL联机模块.exe (区分大小写不敏感)
          target = None
          for a in data.get('assets', []):
              if a.get('name', '').lower().strip() == 'hmol联机模块.exe':
                  target = a
                  break
          if target is None:
              print('::error::No HMOL联机模块.exe asset in release ' + os.environ['TAG'])
              sys.exit(1)

          url = target.get('browserDownloadUrl') or target.get('url') or ''
          print('Downloading ' + url)
          subprocess.run(['curl', '-fsSL', '--retry', '3', '-o', '/tmp/dlc.exe', url], check=True)
          sha = subprocess.run(['sha256sum', '/tmp/dlc.exe'], capture_output=True, text=True, check=True).stdout.split()[0]
          size = os.path.getsize('/tmp/dlc.exe')
          print(f'sha={sha} size={size}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('url=' + url + '\n')
              f.write('sha256=' + sha + '\n')
              f.write('size=' + str(size) + '\n')
          PYEOF

      - name: Write DLC manifest
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          URL: ${{ steps.dlc.outputs.url }}
          SHA: ${{ steps.dlc.outputs.sha256 }}
          SIZE: ${{ steps.dlc.outputs.size }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess

          VERSION = os.environ['VERSION']
          DATE = subprocess.check_output(['date', '-u', '+%Y-%m-%d']).decode().strip()

          def parse_v(s):
              m = re.search(r'(\d+)\.(\d+)(?:\.(\d+))?', str(s or ''))
              return tuple(int(x) for x in m.groups()) if m and all(m.groups()) else (0, 0, 0)

          path = 'update/HMOL-DLC-LJMK-json'
          data = {}
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

          old_min = parse_v(data.get('min_version', '0.0.0'))
          new_v = parse_v(VERSION)
          major = (new_v[0], new_v[1]) > (old_min[0], old_min[1])

          data['name'] = 'HMOL联机模块'
          data['version'] = VERSION
          data['release_date'] = DATE
          data['min_version'] = VERSION
          data['variant'] = 'windows'
          data['mandatory'] = bool(major or data.get('mandatory', False))
          data['exe'] = {
              'url': os.environ['URL'],
              'size': int(os.environ['SIZE']),
              'sha256': os.environ['SHA'],
          }

          if os.path.exists('/tmp/release_body.md'):
              body = open('/tmp/release_body.md', encoding='utf-8').read().strip()
              if body and '<!-- skip-changelog -->' not in body:
                  data['changelog_zh'] = body

          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('=== ' + path + ' ===')
          print(json.dumps(data, ensure_ascii=False, indent=2))
          open('/tmp/touched.txt', 'w').write(path)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TOUCHED=$(cat /tmp/touched.txt)
          git add "$TOUCHED"
          if git diff --staged --quiet; then
            echo "No changes detected, skip commit"
          else
            git commit -m "chore: auto-update DLC manifest to v${{ steps.tag.outputs.version }}"
            git push origin update
            echo "DLC manifest pushed to update branch:"
            echo "  https://cdn.jsdelivr.net/gh/${{ github.repository }}@update/update/HMOL-DLC-LJMK-json"
          fi
